name: ci

on:
  push:
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - run: pip install -r requirements.txt
      - run: python -m src.roll
      - run: python -m src.build
      - name: Independent validation in R
        run: Rscript r/validate_scorecard.R
      - run: pytest -q
